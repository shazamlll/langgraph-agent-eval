[project]
name = "langgraph-agent-eval"
version = "0.1.0"
description = "Portfolio demo: multi-turn LangGraph agent with trajectory evaluation"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.2,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
tracing = ["langsmith>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
